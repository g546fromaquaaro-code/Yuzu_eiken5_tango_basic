<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英検5級 タイムアタック</title>
<style>html,body{margin:0;height:100%;background:#FFF8EF;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}.loading{height:100%;display:grid;place-items:center;color:#7A7591;font-weight:800}</style>
</head>
<body>
<div class="loading">アプリを読み込み中…</div>
<script>
(async()=>{
  try{
    const source='https://cdn.jsdelivr.net/gh/g546fromaquaaro-code/Yuzu_eiken5_tango_basic@4aa0167f73506c9603b8a69e96d4e916c02e29b3/index.html';
    let html=await fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('load failed');return r.text()});
    const homeButton='<button class="nav-btn active" data-screen="home"><span class="ic">🏠</span>ホーム</button>';
    const wordsButton='<a class="nav-btn" href="./words.html" style="text-decoration:none"><span class="ic">📖</span>単語</a>';
    if(!html.includes('href="./words.html"')) html=html.replace(homeButton,homeButton+'\n    '+wordsButton);
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div class="loading">読み込みに失敗しました。再読み込みしてください。</div>'}
})();
</script>
</body>
</html>
