<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFB6C1">
<title>英検5級 単語一覧</title>
<style>
:root{--mint:#5FE0C3;--mint-dark:#39C3A6;--coral:#FF7E9D;--coral-dark:#F4527A;--sun:#FFD15C;--sky:#6FC6F2;--lav:#B9A8FF;--cream:#FFF8EF;--card:#fff;--ink:#3A3550;--soft:#7A7591;--line:#F0E7DA;--shadow:0 6px 0 rgba(58,53,80,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}main{max-width:560px;margin:auto;padding:18px 16px 90px}.top{display:flex;align-items:center;gap:10px}.back{border:2px solid var(--line);background:var(--card);border-radius:999px;width:42px;height:42px;font-size:20px;text-decoration:none;display:grid;place-items:center;color:var(--ink);box-shadow:0 3px 0 var(--line)}h1{font-size:25px;margin:8px 0 2px;color:var(--coral-dark)}.sub{font-size:12px;color:var(--soft);font-weight:700;margin:0 0 14px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.stat{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center;box-shadow:var(--shadow)}.stat b{display:block;font-size:24px;color:var(--coral-dark)}.stat span{font-size:11px;color:var(--soft);font-weight:800}.tools{position:sticky;top:0;z-index:10;background:rgba(255,248,239,.95);backdrop-filter:blur(8px);padding:8px 0 10px}.search{width:100%;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:13px 14px;font-size:16px;color:var(--ink);outline:none}.filters{display:flex;gap:7px;overflow:auto;padding:9px 0 2px}.chip{white-space:nowrap;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 11px;font-weight:800;color:var(--soft)}.chip.active{background:var(--mint);border-color:var(--mint-dark);color:white}.sort-row{display:flex;justify-content:space-between;align-items:center;margin:8px 2px}.count-label{font-size:12px;font-weight:800;color:var(--soft)}select{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:8px;color:var(--ink);font-weight:800}.word{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:13px 14px;margin-bottom:10px;box-shadow:0 4px 0 var(--line)}.en{font-size:19px;font-weight:900}.ja{font-size:13px;color:var(--soft);font-weight:700;margin-top:3px}.genre{display:inline-block;font-size:10px;background:#F2EDFF;color:#7058D6;border-radius:999px;padding:4px 8px;margin-top:7px;font-weight:800}.right{text-align:center;min-width:70px}.mistake{display:inline-flex;align-items:center;justify-content:center;min-width:54px;border-radius:999px;padding:7px 9px;background:#F3F0EA;color:var(--soft);font-weight:900;font-size:12px}.mistake.has{background:#FFD7DE;color:#B52D51}.speak{margin-top:7px;border:none;border-radius:999px;width:38px;height:38px;background:linear-gradient(#83D4FA,#3CA8E0);color:white;font-size:17px;box-shadow:0 3px 0 #3CA8E0}.empty{text-align:center;padding:50px 10px;color:var(--soft);font-weight:800}.notice{background:#FFF3CC;border:2px solid #F4B400;border-radius:15px;padding:10px 12px;font-size:12px;font-weight:700;color:#765200;margin-bottom:10px}.loading{text-align:center;padding:60px 0;font-weight:900;color:var(--soft)}
</style>
</head>
<body><main>
<div class="top"><a class="back" href="./">←</a><div><h1>📖 単語一覧</h1><p class="sub">全単語と、まちがえた回数を確認できます</p></div></div>
<div class="summary"><div class="stat"><b id="total">—</b><span>登録単語</span></div><div class="stat"><b id="wrongTotal">—</b><span>まちがい合計</span></div></div>
<div class="notice">クイズで間違えるたびに、この端末へ自動で記録されます。</div>
<div class="tools"><input id="search" class="search" placeholder="英語・日本語で検索"><div id="filters" class="filters"></div><div class="sort-row"><span id="visibleCount" class="count-label"></span><select id="sort"><option value="default">ジャンル順</option><option value="wrong">間違いが多い順</option><option value="az">英語 A→Z</option></select></div></div>
<div id="list" class="loading">単語を読み込み中…</div>
</main>
<script>
const WRONG_KEY='eiken_wrong_v1';
const APP_SOURCE='https://cdn.jsdelivr.net/gh/g546fromaquaaro-code/Yuzu_eiken5_tango_basic@4aa0167f73506c9603b8a69e96d4e916c02e29b3/index.html';
let GENRES={};let rows=[];let currentGenre='all';
function loadWrong(){try{return JSON.parse(localStorage.getItem(WRONG_KEY)||'{}')}catch(e){return {}}}
function mistakeCount(genre,en){const db=loadWrong();return Number(db?.[genre]?.[en]?.count||0)}
function speak(text){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadGenres(){
 const html=await fetch(APP_SOURCE,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('単語データを取得できませんでした');return r.text()});
 const start=html.indexOf('const GENRES =');const end=html.indexOf('const GENRE_TAG_CLASS',start);
 if(start<0||end<0)throw new Error('単語データを取得できませんでした');
 const source=html.slice(start+'const GENRES ='.length,end).trim().replace(/;\s*$/,'');
 GENRES=Function('"use strict"; return ('+source+')')();
 rows=[];Object.entries(GENRES).forEach(([genre,g])=>g.words.forEach(([en,ja],i)=>rows.push({genre,genreName:g.name,en,ja,index:i})));
}
function renderFilters(){const el=document.getElementById('filters');el.innerHTML='';const items=[['all','すべて'],...Object.entries(GENRES).map(([k,g])=>[k,g.short])];items.forEach(([k,label])=>{const b=document.createElement('button');b.className='chip'+(k===currentGenre?' active':'');b.textContent=label;b.onclick=()=>{currentGenre=k;renderFilters();render()};el.appendChild(b)})}
function render(){
 const q=document.getElementById('search').value.trim().toLowerCase();const sort=document.getElementById('sort').value;
 let data=rows.map(r=>({...r,count:mistakeCount(r.genre,r.en)})).filter(r=>(currentGenre==='all'||r.genre===currentGenre)&&(!q||r.en.toLowerCase().includes(q)||r.ja.toLowerCase().includes(q)));
 if(sort==='wrong')data.sort((a,b)=>b.count-a.count||a.en.localeCompare(b.en));
 if(sort==='az')data.sort((a,b)=>a.en.localeCompare(b.en));
 const totalWrong=rows.reduce((s,r)=>s+mistakeCount(r.genre,r.en),0);
 document.getElementById('total').textContent=rows.length;document.getElementById('wrongTotal').textContent=totalWrong;document.getElementById('visibleCount').textContent=data.length+'語を表示';
 const list=document.getElementById('list');list.className='';
 if(!data.length){list.innerHTML='<div class="empty">見つかりませんでした</div>';return}
 list.innerHTML=data.map(r=>`<div class="word"><div><div class="en">${escapeHtml(r.en)}</div><div class="ja">${escapeHtml(r.ja)}</div><span class="genre">${escapeHtml(r.genreName)}</span></div><div class="right"><div class="mistake ${r.count?'has':''}">✕ ${r.count}回</div><br><button class="speak" data-word="${escapeHtml(r.en)}">🔊</button></div></div>`).join('');
 list.querySelectorAll('.speak').forEach(b=>b.onclick=()=>speak(b.dataset.word));
}
(async()=>{try{await loadGenres();renderFilters();render();document.getElementById('search').addEventListener('input',render);document.getElementById('sort').addEventListener('change',render);window.addEventListener('pageshow',render)}catch(e){document.getElementById('list').innerHTML='<div class="empty">'+escapeHtml(e.message)+'</div>'}})();
</script></body></html>
